name: TechStore Copilot Setup

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

jobs:
  setup-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: techstore
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d techstore"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Configure local database environment
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5433/techstore
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
          SPRING_JPA_HIBERNATE_DDL_AUTO: update
        run: echo "Database configuration prepared for CI validation."

      - name: Run Maven tests
        shell: bash
        run: bash ./mvnw test
