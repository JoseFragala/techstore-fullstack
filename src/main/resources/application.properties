spring.application.name=techstore
spring.datasource.url=jdbc:postgresql://localhost:5433/techstore
spring.datasource.username=postgres
spring.datasource.password=postgres

# In development, Hibernate can build or update the schema directly from the entity classes.
# This keeps the Java model as the single source of truth instead of maintaining a separate schema.sql file.
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

# Session storage. Role-specific lifetimes are introduced in the next security slice.
spring.session.jdbc.initialize-schema=always
spring.session.timeout=15m
techstore.security.allowed-origins=${TECHSTORE_ALLOWED_ORIGINS:http://localhost:5173}
techstore.security.secure-cookies=${TECHSTORE_SECURE_COOKIES:true}
