spring.application.name=techstore
spring.datasource.url=jdbc:postgresql://localhost:5433/techstore
spring.datasource.username=postgres
spring.datasource.password=postgres

# In development, Hibernate can build or update the schema directly from the entity classes.
# This keeps the Java model as the single source of truth instead of maintaining a separate schema.sql file.
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
