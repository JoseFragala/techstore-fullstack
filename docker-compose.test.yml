services:
  postgres-test:
    image: postgres:17
    environment:
      POSTGRES_DB: techstore_test
      POSTGRES_USER: techstore_test
      POSTGRES_PASSWORD: local-test-only
    ports:
      - "127.0.0.1:55434:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U techstore_test -d techstore_test"]
      interval: 2s
      timeout: 5s
      retries: 30

